# =============================================================================
# BacktestingEngine Production Environment Values
# Production deployment with Azure Key Vault integration
# =============================================================================

# Environment marker
environment: production

# High replica count for production availability
replicaCount: 5

# Image configuration - use production-specific tag
image:
  repository: backtesting-engine
  pullPolicy: IfNotPresent
  tag: "prod"

# High resource allocation for production
resources:
  limits:
    cpu: "2000m"
    memory: "4Gi"
  requests:
    cpu: "1000m"
    memory: "2Gi"

# =============================================================================
# Secrets Configuration - Azure Key Vault Integration
# =============================================================================
# Secrets are injected from Azure Key Vault using External Secrets Operator
# Database URL format: postgresql://username:password@host:port/database

secrets:
  database:
    enabled: true
    # These values are injected from Azure Key Vault at runtime
    # Key Vault secret names: backtesting-prod-db-username, backtesting-prod-db-password, backtesting-prod-db-url
    username: ""  # Injected from Azure Key Vault
    password: ""  # Injected from Azure Key Vault
    url: ""       # Injected from Azure Key Vault (full postgresql:// connection string)
  
  elasticsearch:
    enabled: false
    endpoint: ""
    username: ""
    password: ""

# External database configuration (values from Key Vault secrets)
externalDatabase:
  enabled: true
  host: ""  # Extracted from secrets.database.url
  port: 5432
  database: "backtesting_prod"
  username: ""  # From secrets.database.username
  existingSecret: ""
  type: ClusterIP

# Disable built-in PostgreSQL
postgresql:
  enabled: false


