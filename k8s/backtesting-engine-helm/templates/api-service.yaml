apiVersion: v1
kind: Service
metadata:
  name: {{ include "backtesting-engine.fullname" . }}-api
  labels:
    {{- include "backtesting-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  namespace: {{ .Release.Namespace | quote }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "backtesting-engine.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
