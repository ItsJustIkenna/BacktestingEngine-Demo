# Development values for backtesting-engine
# Comprehensive development environment configuration

# Environment marker
environment: development

replicaCount: 1

image:
  repository: tradingplatformacr.azurecr.io/backtesting-engine
  pullPolicy: IfNotPresent  # Faster for development
  tag: "dev"

# Resource limits for development
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Disable autoscaling in dev
autoscaling:
  enabled: false

# =============================================================================
# Development Secrets
# =============================================================================
# 🔐 SECURE: No actual secrets stored in this file!
# Secrets are provided at deploy time via --set-string

secrets:
  # Database credentials (provided at deploy time)
  database:
    username: "backtesting_dev"  # Non-sensitive, can be stored
    # password: ""  # SECURE: Provided via --set-string at deploy time
    
  # Redis credentials (provided at deploy time)
  redis:
    # password: ""  # SECURE: Provided via --set-string at deploy time
    
  # API keys (provided at deploy time)
  api:
    # secretKey: ""  # SECURE: Provided via --set-string at deploy time
    # jwtSecret: ""  # SECURE: Provided via --set-string at deploy time

# Simplified configuration for development
config:
  environment: development
  logging:
    level: debug
  performance:
    worker_threads: 2
  
# Development persistence settings
persistence:
  enabled: false
  
# Service configuration
service:
  type: ClusterIP
  port: 8080

# Ingress disabled in dev
ingress:
  enabled: false

# Metrics enabled for testing
metrics:
  enabled: true
  port: 9090

# Consolidated environment variables for development
env:
  ENVIRONMENT: "development"
  DEBUG_MODE: "true"
  ENABLE_DEVELOPMENT_FEATURES: "true"
  DATABASE_POOL_SIZE: "5"
  REDIS_POOL_SIZE: "3"
  ENABLE_QUERY_LOGGING: "true"
  BACKTEST_TIMEOUT_SECONDS: "300"  # Shorter timeout for development
  MAX_CONCURRENT_BACKTESTS: "2"    # Fewer concurrent tests
  RUST_LOG: "debug"

# Node selector for development nodes
nodeSelector:
  environment: development

# Strategy Export configuration (dev settings)
strategyExport:
  configMap:
    enabled: true
  performance:
    minSharpeRatio: 1.0        # Lower threshold for dev
    minProfitFactor: 1.1       # Lower threshold for dev
    minWinRate: 0.50           # Lower threshold for dev
    maxDrawdown: 0.25          # Higher tolerance for dev
    minTrades: 50              # Lower minimum for dev
    minNetProfit: 5000.0       # Lower minimum for dev
    maxAvgTradeDuration: 48.0  # Higher tolerance for dev
    minVolatilityAdjustedReturn: 0.5  # Lower threshold for dev
    minCalmarRatio: 1.0        # Lower threshold for dev
    requirePositiveSkew: false # More relaxed for dev
  deployment:
    signalEnginePath: "/app/signal-engine"
    environments:
      development:
        path: "/app/signal-engine/strategies/development"
        enabled: true
        maxStrategies: 20        # More strategies for dev testing
        approvalRequired: false  # No approval for dev
      staging:
        path: "/app/signal-engine/strategies/staging"
        enabled: false           # Disabled in dev environment
        maxStrategies: 0
        approvalRequired: true
      production:
        path: "/app/signal-engine/strategies/production"
        enabled: false           # Disabled in dev environment
        maxStrategies: 0
        approvalRequired: true
    autoDeployment:
      enabled: true
      cronSchedule: "*/15 * * * *"  # Every 15 minutes for dev
      maxConcurrentDeployments: 5   # More concurrent for dev
      timeoutSeconds: 300           # Shorter timeout for dev
      targetEnvironment: "development"
      batchSize: 3                  # Larger batches for dev
      delayBetweenDeployments: 60   # Shorter delay for dev
  filesystem:
    exportBasePath: "/app/exports"
    strategySourcePath: "/app/backtesting-engine/strategy/src/strategies"
    backupEnabled: false            # Disabled backups for dev
    backupRetentionDays: 7          # Shorter retention for dev
  approval:
    development:
      requiredApprovers: 0          # No approval for dev
      allowedRoles:
        - "developer"
        - "trader"
        - "admin"
        - "intern"              # Additional role for dev
      autoApproveThreshold: 50.0    # Lower threshold for dev
      timeoutHours: 0.5             # Shorter timeout for dev
    staging:
      requiredApprovers: 0          # No staging approval in dev
      allowedRoles:
        - "developer"
        - "admin"
      autoApproveThreshold: 75.0
      timeoutHours: 2
    production:
      requiredApprovers: 999        # Effectively disabled in dev
      allowedRoles: []
      autoApproveThreshold: 100.0
      timeoutHours: 1
    notifications:
      enabled: false              # Disabled notifications for dev
      emailRecipients:
        - "dev-team@company.com"
    audit:
      enabled: false              # Disabled audit for dev
      retentionDays: 7            # Short retention for dev
      includePerformanceData: false
      includeParameters: false
  risk:
    globalLimits:
      maxTotalExposure: 25000.0   # Lower limits for dev
      maxStrategiesPerSymbol: 10  # Higher limits for dev testing
      maxStrategiesPerExchange: 20
      emergencyStopEnabled: false # Disabled for dev
    strategyLimits:
      maxPositionSize: 5000.0     # Lower position sizes for dev
      maxOrderSize: 1000.0        # Lower order sizes for dev
      maxDailyLoss: 500.0         # Lower daily loss for dev
      maxLeverage: 5.0            # Higher leverage for dev testing
      positionConcentrationLimit: 0.5  # Higher concentration for dev
    environmentLimits:
      development:
        capitalAllocationLimit: 25000.0
        maxConcurrentStrategies: 10    # More concurrent for dev
        testingMode: true
      staging:
        capitalAllocationLimit: 0.0    # Disabled in dev
        maxConcurrentStrategies: 0
        testingMode: true
      production:
        capitalAllocationLimit: 0.0    # Disabled in dev
        maxConcurrentStrategies: 0
        testingMode: true
