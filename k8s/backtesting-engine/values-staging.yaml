# Staging values for backtesting-engine
replicaCount: 2

image:
  repository: tradingplatformacr.azurecr.io/backtesting-engine
  pullPolicy: IfNotPresent
  tag: ""

# Resource limits for staging
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

# Enable autoscaling for staging
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Staging configuration
config:
  environment: staging
  logging:
    level: info
  performance:
    worker_threads: 4
  
# Enable persistence for staging
persistence:
  enabled: true
  size: 20Gi
  storageClass: standard

# Service configuration
service:
  type: ClusterIP
  port: 8080

# Ingress for staging
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: backtesting-engine-staging.tradingplatform.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: backtesting-engine-staging-tls
      hosts:
        - backtesting-engine-staging.tradingplatform.local

# Metrics enabled
metrics:
  enabled: true
  port: 9090

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Staging environment variables
env:
  RUST_LOG: info
  ENVIRONMENT: staging
