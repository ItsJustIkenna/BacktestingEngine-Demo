# Production values for backtesting-engine
replicaCount: 5

image:
  repository: prodtradingbotregistry.azurecr.io/backtesting-engine
  pullPolicy: IfNotPresent
  tag: ""

# High resource limits for production
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Enable autoscaling for production
autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

# Production configuration
config:
  environment: production
  logging:
    level: warn
    enable_file_logging: true
  performance:
    worker_threads: 8
  tls:
    enabled: true
  
# Enable persistence for production
persistence:
  enabled: true
  size: 100Gi
  storageClass: premium-ssd
  logs:
    enabled: true
    size: 50Gi

# Production service configuration
service:
  type: ClusterIP
  port: 8080
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"

# Production ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: backtesting-engine.tradingplatform.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: backtesting-engine-prod-tls
      hosts:
        - backtesting-engine.tradingplatform.com

# Metrics enabled with monitoring
metrics:
  enabled: true
  port: 9090

# ServiceMonitor for Prometheus
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics
  
# Pod Disruption Budget for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 3

# Network policy for security
networkPolicy:
  enabled: true
  ingress:
    enabled: true
    rules:
      - from:
          - namespaceSelector:
              matchLabels:
                name: trading-platform
          - namespaceSelector:
              matchLabels:
                name: monitoring
        ports:
          - protocol: TCP
            port: 8080
          - protocol: TCP
            port: 9090
  egress:
    enabled: true
    rules:
      - to:
          - namespaceSelector:
              matchLabels:
                name: trading-platform
        ports:
          - protocol: TCP
            port: 5432  # PostgreSQL
          - protocol: TCP
            port: 6379  # Redis

# Production environment variables
env:
  RUST_LOG: warn
  ENVIRONMENT: production

# Anti-affinity for production
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - backtesting-engine
        topologyKey: kubernetes.io/hostname

# Production node selector
nodeSelector:
  kubernetes.io/os: linux
  node.kubernetes.io/instance-type: Standard_D8s_v3
