[package]
name = "genetic"
version = "0.1.0"
edition = "2021"

[features]
default = []
postgres = ["databaseschema", "dataloader/postgres", "strategy/postgres", "orderbook/postgres"]

[dependencies]
rand = "0.8"
dataloader = { path = "../dataloader" }
config = { path = "../config" }
# Removed circular dependency: backtest now depends on genetic, not vice versa
# backtest = { path = "../backtest" }
strategy = { path = "../strategy" }
orderbook = { path = "../orderbook" }
portfoliomanager = { path = "../portfoliomanager" }
riskmanager = { path = "../riskmanager" }
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = "0.4"
databaseschema = { path = "../../databaseschema", optional = true }
uuid = "1.0"

# Performance optimizations
rayon = "1.8"
rustc-hash = "1.1"
smallvec = "1.11"
futures = "0.3"  # For async execution in Rayon threads

# Logging
ultra-logger = { path = "../../LoggingEngine/ultra-logger" }
once_cell = "1.0"

[dev-dependencies]
# backtest = { path = "../backtest" }
strategy = { path = "../strategy" }
orderbook = { path = "../orderbook" }
portfoliomanager = { path = "../portfoliomanager" }
riskmanager = { path = "../riskmanager" }
criterion = "0.5"

[[bench]]
name = "genetic_benchmark"
harness = false
