[package]
name = "backtest"
version = "0.1.0"
edition = "2021"

[features]
default = []
postgres = ["dataloader/postgres", "strategy/postgres", "walkforward/postgres", "databaseschema"]
# Enable verbose debug logging in hot paths (trades, fills, etc.)
# Only enable for debugging - impacts performance
debug_logging = []

[dependencies]
# External dependencies
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = "0.4"
rayon = "1.8"
rand = "0.8"
rand_distr = "0.4"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
ordered-float = "4.2"

# Performance optimizations
rustc-hash = "1.1"
smallvec = "1.11"

# Internal workspace dependencies
config = { path = "../config" }
dataloader = { path = "../dataloader" }
data_prep = { path = "../data_prep" }
orderbook = { path = "../orderbook" }
portfoliomanager = { path = "../portfoliomanager" }
riskmanager = { path = "../riskmanager" }
strategy = { path = "../strategy" }
signal = { path = "../signal" }
metrics = { path = "../metrics" }
genetic = { path = "../genetic" }
walkforward = { path = "../walkforward" }
databaseschema = { path = "../../databaseschema", optional = true }

# Logging
ultra-logger = { path = "../../LoggingEngine/ultra-logger" }
once_cell = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
metrics = { path = "../metrics" }
