[package]
name = "backtest"
version = "0.1.0"
edition = "2021"

[features]
default = []
postgres = ["dataloader/postgres", "strategy/postgres"]

[dependencies]
# External dependencies
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = "0.4"
rayon = "1.0"
rand = "0.8"
anyhow = "1.0"

# Internal workspace dependencies
config = { path = "../config" }
dataloader = { path = "../dataloader" }
orderbook = { path = "../orderbook" }
portfoliomanager = { path = "../portfoliomanager" }
riskmanager = { path = "../riskmanager" }
strategy = { path = "../strategy" }
signal = { path = "../signal" }
metrics = { path = "../metrics" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
metrics = { path = "../metrics" }
