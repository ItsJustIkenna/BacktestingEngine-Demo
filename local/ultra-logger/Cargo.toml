[package]
name = "ultra-logger"
version = "0.1.0"
edition = "2021"
description = "In-repo stdout logger used by this demo. Written fresh for standalone builds; not copied from LoggingEngine."
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", default-features = false, features = ["sync"] }
