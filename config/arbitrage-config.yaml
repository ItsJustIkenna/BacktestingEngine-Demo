# Arbitrage Strategy Backtest Configuration
# This configuration enables multi-exchange arbitrage backtesting

# Database configuration (uses environment variables)
database:
  host: "${POSTGRES_HOST:-localhost}"
  port: ${POSTGRES_PORT:-5432}
  database: "${POSTGRES_DB:-trading_data}"
  username: "${POSTGRES_USER:-trader}"
  password: "${POSTGRES_PASSWORD:-secure_password}"
  max_connections: 10
  connection_timeout: 30

# Trading configuration with arbitrage routing
trading:
  commission_rate: 0.001  # Fallback commission rate
  slippage_bps: 5.0       # Base slippage in basis points
  initial_capital: 100000.0
  max_position_size: 0.05  # 5% of portfolio per position
  risk_free_rate: 0.02     # 2% risk-free rate for Sharpe calculation
  
  # Multi-exchange arbitrage configuration
  routing_mode:
    Arbitrage:
      exchanges: ["binance", "coinbase", "kraken", "ftx"]
      min_profit_bps: 15.0          # Minimum 15 bps profit threshold
      max_holding_time_seconds: 300  # Maximum 5 minutes holding time
      risk_limits:
        max_open_positions: 5       # Maximum 5 concurrent arbitrages
        max_daily_loss: 2000.0      # Maximum $2000 daily loss
        max_exchange_exposure: 25000.0  # Maximum $25K per exchange
        min_liquidity_ratio: 3.0    # Minimum 3:1 liquidity to position ratio

# Data source configuration
data:
  default_timeframe: "1m"  # 1-minute intervals for arbitrage
  data_sources: ["binance", "coinbase", "kraken", "ftx"]
  cache_enabled: true
  cache_duration_hours: 1  # Short cache duration for fresh data

# Output configuration
output:
  results_dir: "arbitrage_results"
  reports_dir: "arbitrage_reports"
  charts_enabled: true
  export_formats: ["json", "csv", "html"]

# Analysis configuration
analysis:
  monte_carlo:
    enabled: true
    num_simulations: 1000
    confidence_level: 0.95
    bootstrap_fraction: 1.0
    bootstrap_method: "trades"
  
  walk_forward:
    enabled: true
    train_period_days: 30
    test_period_days: 7
    step_size_days: 1
    min_trades_threshold: 10

# Exchange-specific configurations
exchange_configs:
  binance:
    maker_fee: 0.001    # 10 bps
    taker_fee: 0.001    # 10 bps
    min_order_size: 0.001  # 0.001 BTC minimum
    max_order_size: 100.0  # 100 BTC maximum
    latency_ms: 15      # Average 15ms latency
    uptime_pct: 99.95   # 99.95% uptime
    
  coinbase:
    maker_fee: 0.005    # 50 bps
    taker_fee: 0.005    # 50 bps  
    min_order_size: 0.001
    max_order_size: 50.0
    latency_ms: 30      # Average 30ms latency
    uptime_pct: 99.9    # 99.9% uptime
    
  kraken:
    maker_fee: 0.0016   # 16 bps
    taker_fee: 0.0026   # 26 bps
    min_order_size: 0.001
    max_order_size: 25.0
    latency_ms: 50      # Average 50ms latency
    uptime_pct: 99.8    # 99.8% uptime
    
  ftx:
    maker_fee: 0.0002   # 2 bps (maker rebate in some cases)
    taker_fee: 0.0007   # 7 bps
    min_order_size: 0.001
    max_order_size: 100.0
    latency_ms: 20      # Average 20ms latency
    uptime_pct: 99.5    # 99.5% uptime

# Strategy-specific parameters
strategy_params:
  # Arbitrage opportunity detection
  min_spread_bps: 15.0              # Minimum spread to consider
  max_spread_bps: 500.0             # Maximum spread (likely stale data)
  opportunity_timeout_ms: 2000      # Opportunity expires after 2 seconds
  price_staleness_threshold_ms: 5000  # Reject prices older than 5 seconds
  
  # Execution parameters
  simultaneous_execution: true      # Execute both legs simultaneously
  partial_fill_acceptable: false   # Require complete fills
  max_slippage_tolerance_bps: 10.0  # Maximum acceptable slippage
  
  # Risk management
  correlation_threshold: 0.95       # Maximum price correlation between exchanges
  volatility_adjustment: true      # Adjust thresholds based on volatility
  circuit_breaker_loss: 5000.0     # Stop trading after $5K loss
  
  # Performance optimization
  batch_processing: true           # Process multiple opportunities together
  latency_compensation: true       # Adjust for network latency
  priority_exchanges: ["binance", "ftx"]  # Prefer these exchanges

# Simulation parameters
simulation:
  # Market data synchronization
  sync_tolerance_ms: 100           # Allow 100ms data sync tolerance
  interpolate_missing_data: true   # Fill gaps in market data
  
  # Execution simulation
  simulate_network_latency: true   # Include realistic network delays
  simulate_partial_fills: true    # Include partial fill scenarios
  simulate_exchange_outages: false # Don't simulate outages by default
  
  # Order book simulation
  order_book_depth_levels: 10      # Simulate 10 price levels
  liquidity_scaling_factor: 0.7    # Assume 70% of displayed liquidity available
  spread_widening_factor: 1.2      # Widen spreads under pressure

# Reporting configuration
reporting:
  # Standard metrics
  include_standard_metrics: true
  include_trade_analysis: true
  include_risk_metrics: true
  
  # Arbitrage-specific metrics
  include_opportunity_analysis: true
  include_exchange_performance: true
  include_latency_analysis: true
  include_cross_exchange_correlation: true
  
  # Visualization
  generate_profit_timeline: true
  generate_opportunity_heatmap: true
  generate_exchange_comparison: true
  generate_latency_distribution: true
  
  # Export options
  detailed_trade_log: true
  execution_timeline: true
  missed_opportunities_log: true
  exchange_health_metrics: true
