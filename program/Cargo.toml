[package]
name = "program"
version = "0.1.0"
edition = "2021"

[features]
default = []
postgres = ["dataloader/postgres", "strategy/postgres", "orderbook/postgres", "walkforward/postgres", "backtest/postgres"]

[dependencies]
# CLI framework
clap = { version = "4.0", features = ["derive"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde_json = "1.0"
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Database
deadpool-postgres = "0.10"
deadpool = "0.12"
tokio-postgres = { version = "0.7", features = ["with-uuid-0_8"] }
diesel = { version = "2.2", features = ["postgres", "r2d2", "chrono", "uuid", "numeric", "64-column-tables", "serde_json"] }
diesel-async = { version = "0.5", features = ["postgres", "deadpool"] }
dotenv = "0.15"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Configuration serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# BigDecimal for precision
bigdecimal = "0.4"

# Progress bar and random for Monte Carlo
indicatif = "0.17"
rand = "0.8"

# Message broker for real-time progress streaming
publisher = { path = "../../MessageBrokerEngine/publisher" }
bytes = "1.0"

# Internal dependencies
walkforward = { path = "../walkforward" }
backtest = { path = "../backtest" }
strategy = { path = "../strategy" }
orderbook = { path = "../orderbook" }
portfoliomanager = { path = "../portfoliomanager" }
riskmanager = { path = "../riskmanager" }
config = { path = "../config" }
metrics = { path = "../metrics" }
dataloader = { path = "../dataloader" }
genetic = { path = "../genetic" }
databaseschema = { path = "../../databaseschema" }

# Logging
ultra-logger = { path = "../../LoggingEngine/ultra-logger" }
once_cell = "1.0"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
