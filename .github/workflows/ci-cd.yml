name: BacktestingEngine CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        type: boolean
        default: false

concurrency:
  group: backtesting-engine-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/nwagbara-group-llc/backtesting-engine
  PARALLEL_JOBS: 3
  DOCKER_BUILDKIT: 1
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  validate:
    name: Validate & Test
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 60
    outputs:
      tests-passed: ${{ steps.test-result.outputs.passed || steps.skip-test-result.outputs.passed }}
      skip-tests: ${{ steps.check-skip.outputs.skip }}
    steps:
      - name: Checkout BacktestingEngine
        uses: actions/checkout@v4
        with:
          path: BacktestingEngine

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: databaseschema
          ref: main

      - name: Checkout SignalEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine

      - name: Verify Rust
        shell: powershell
        run: |
          Write-Host "Checking Rust installation..."
          rustc --version
          cargo --version

      - name: Check for Skip Tests Flag
        id: check-skip
        shell: powershell
        run: |
          cd BacktestingEngine
          $commitMsg = git log -1 --pretty=%B
          if ($commitMsg -match '\[skip-tests\]') {
            Write-Host "⏭️  [skip-tests] flag detected in commit message - skipping tests"
            echo "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Running full validation with tests"
            echo "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Target Directory
        uses: actions/cache@v4
        with:
          path: BacktestingEngine/target
          key: ${{ runner.os }}-target-backtesting-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-backtesting-

      - name: Fast Check
        shell: powershell
        run: |
          Write-Host "Running fast cargo check..."
          cd BacktestingEngine
          cargo check --workspace --jobs 10
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Cargo check failed"
            exit 1
          }
          Write-Host "✅ Fast check passed!"

      - name: Build Workspace
        shell: powershell
        run: |
          Write-Host "Building BacktestingEngine workspace..."
          cd BacktestingEngine
          cargo build --workspace --jobs 10
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Build failed!"
            exit 1
          }
          Write-Host "✅ Build passed!"

      - name: Run Tests
        if: steps.check-skip.outputs.skip != 'true'
        id: test-result
        shell: powershell
        run: |
          Write-Host "Running tests..."
          cd BacktestingEngine
          cargo test --workspace --jobs 10
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Tests passed!"
            echo "passed=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "❌ Tests failed!"
            echo "passed=false" >> $env:GITHUB_OUTPUT
            exit 1
          }

      - name: Skip Tests
        if: steps.check-skip.outputs.skip == 'true'
        id: skip-test-result
        shell: powershell
        run: |
          Write-Host "⏭️  Tests skipped"
          echo "passed=true" >> $env:GITHUB_OUTPUT

      - name: Security Audit
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Auditing dependencies..."
          cd BacktestingEngine
          if (-not (cargo install --list | Select-String "cargo-audit")) {
            cargo install cargo-audit
          }
          cargo audit

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install UI Dependencies
        shell: powershell
        run: |
          cd BacktestingEngine/gui
          npm ci --legacy-peer-deps
          Write-Host "✅ UI dependencies installed!"

      - name: Run UI Tests
        shell: powershell
        run: |
          cd BacktestingEngine/gui
          npm test
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ UI tests passed!"
          } else {
            Write-Host "❌ UI tests failed!"
            exit 1
          }

      - name: Build UI
        shell: powershell
        run: |
          cd BacktestingEngine/gui
          npm run build
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ UI build successful!"
          } else {
            Write-Host "❌ UI build failed!"
            exit 1
          }

  build:
    name: Build & Push
    runs-on: [self-hosted, windows, x64]
    needs: validate
    if: needs.validate.outputs.tests-passed == 'true' || github.event.inputs.skip_tests == 'true'
    timeout-minutes: 45
    outputs:
      image-exists: ${{ steps.image-check.outputs.exists }}
    steps:
      - name: Checkout BacktestingEngine
        uses: actions/checkout@v4
        with:
          path: BacktestingEngine
          fetch-depth: 0

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: databaseschema
          ref: main
          fetch-depth: 0

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Image Cache
        id: image-check
        shell: powershell
        run: |
          Write-Host "Checking if image exists..."
          $imageTag = "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          $ErrorActionPreference = 'SilentlyContinue'
          docker pull $imageTag 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "[OK] Image cache hit"
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "[INFO] Will build image"
          }
          exit 0

      - name: Build & Push Image
        if: steps.image-check.outputs.exists != 'true'
        shell: powershell
        run: |
          Write-Host "Building Docker image..."
          $startTime = Get-Date
          
          $requiredDeps = @("databaseschema", "LoggingEngine")
          foreach ($dep in $requiredDeps) {
            if (Test-Path $dep) {
              Write-Host "[OK] Dependency found: $dep"
            } else {
              Write-Host "[ERROR] Missing: $dep"
              exit 1
            }
          }
          
          Write-Host "[SETUP] Creating .dockerignore..."
          $dockerignoreContent = @"
          **/.git/
          **/.gitignore
          **/.github/
          **/target/
          **/.vscode/
          **/.idea/
          **/*.swp
          **/.DS_Store
          **/.env
          **/.env.*
          **/*.md
          **/LICENSE
          **/Dockerfile
          **/.dockerignore
          **/docker-compose.yml
          **/compose.yaml
          BacktestingEngine/k8s/
          **/.cargo/
          **/Makefile
          "@
          Set-Content -Path ".dockerignore" -Value $dockerignoreContent
          
          Write-Host "[BUILD] Starting build..."
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          Write-Host "[INFO] Building with immutable tag: $shortSha"
          
          docker build `
            --platform linux/amd64 `
            --tag ${{ env.IMAGE_NAME }}:$shortSha `
            --file BacktestingEngine/deployment/Dockerfile `
            --build-arg BUILDKIT_INLINE_CACHE=1 `
            --progress=plain `
            .
            
          if ($LASTEXITCODE -ne 0) {
            throw "Docker build failed"
          }
          
          $buildDuration = (Get-Date) - $startTime
          Write-Host "[OK] Build completed in $([math]::Round($buildDuration.TotalMinutes, 1)) minutes"
          
          Write-Host "[PUSH] Pushing image..."
          docker push ${{ env.IMAGE_NAME }}:$shortSha
          Write-Host "[OK] Pushed image with immutable tag: $shortSha"
          
          # Security scan with Trivy
          Write-Host "[SCAN] Running security scan with Trivy..."
          if (-not (Test-Path "trivy.exe")) {
            Write-Host "Installing Trivy..."
            Invoke-WebRequest -Uri "https://github.com/aquasecurity/trivy/releases/download/v0.48.3/trivy_0.48.3_windows-64bit.zip" -OutFile "trivy.zip"
            Expand-Archive trivy.zip -Force
            Move-Item trivy/trivy.exe . -Force
            Remove-Item trivy.zip, trivy -Recurse -Force
          }
          
          .\\trivy.exe image --severity HIGH,CRITICAL --exit-code 0 --format sarif --output trivy-results.sarif ${{ env.IMAGE_NAME }}:$shortSha
          .\\trivy.exe image --severity HIGH,CRITICAL --exit-code 0 --format table ${{ env.IMAGE_NAME }}:$shortSha
          Write-Host "[OK] Security scan complete"
          
      - name: Upload API Security Scan
        uses: github/codeql-action/upload-sarif@v3
        if: false  # Disabled: Requires security-events permission not available on self-hosted runner
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: backtesting-api
          
      - name: Build Summary
        shell: powershell
        run: |
          $duration = (Get-Date) - (Get-Date).AddMinutes(-5)  # Approximate
          Write-Host "[OK] Total time: $([math]::Round($duration.TotalMinutes, 1)) minutes"

      - name: Validate Image
        shell: powershell
        run: |
          Write-Host "Validating image..."
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          docker pull ${{ env.IMAGE_NAME }}:$shortSha
          $imageSize = docker inspect ${{ env.IMAGE_NAME }}:$shortSha --format='{{.Size}}' | ForEach-Object { [math]::Round($_ / 1MB, 1) }
          Write-Host "[INFO] Image size: $imageSize MB"
          docker run --rm ${{ env.IMAGE_NAME }}:$shortSha ls -la /bin/server
          Write-Host "[OK] Validation complete"

      - name: Build & Push UI Image
        shell: powershell
        run: |
          Write-Host "Building UI Docker image..."
          $uiImageName = "${{ env.IMAGE_NAME }}-ui"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          
          docker build `
            --platform linux/amd64 `
            --tag ${uiImageName}:$shortSha `
            --file BacktestingEngine/deployment/Dockerfile.ui `
            --progress=plain `
            .
            
          if ($LASTEXITCODE -ne 0) {
            throw "UI Docker build failed"
          }
          
          Write-Host "[PUSH] Pushing UI image..."
          docker push ${uiImageName}:$shortSha
          Write-Host "[OK] UI image pushed with immutable tag: $shortSha"
          
      - name: Scan UI Image
        shell: powershell
        continue-on-error: true
        run: |
          $uiImageName = "${{ env.IMAGE_NAME }}-ui"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          Write-Host "[SCAN] Running UI security scan with Trivy..."
          .\trivy.exe image --severity HIGH,CRITICAL --exit-code 0 --format table ${uiImageName}:$shortSha
          Write-Host "[OK] UI security scan complete"
          
      - name: Upload UI Security Scan
        uses: github/codeql-action/upload-sarif@v3
        if: false  # Disabled: Requires security-events permission not available on self-hosted runner
        continue-on-error: true
        with:
          sarif_file: trivy-ui-results.sarif
          category: backtesting-ui
          
      - name: UI Build Summary
        shell: powershell
        run: |
          $uiImageName = "${{ env.IMAGE_NAME }}-ui"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $imageSize = docker inspect ${uiImageName}:$shortSha --format='{{.Size}}' | ForEach-Object { [math]::Round($_ / 1MB, 1) }
          Write-Host "[OK] UI image size: $imageSize MB"

      - name: Output Summary
        shell: powershell
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          Write-Host "`n=========================================="
          Write-Host "Build Summary"
          Write-Host "=========================================="
          Write-Host "API Image: ${{ env.IMAGE_NAME }}"
          Write-Host "UI Image: ${{ env.IMAGE_NAME }}-ui"
          Write-Host "Immutable Tag: $shortSha"
          Write-Host "Commit: ${{ github.sha }}"
          Write-Host "`nPull API: docker pull ${{ env.IMAGE_NAME }}:$shortSha"
          Write-Host "Pull UI:  docker pull ${{ env.IMAGE_NAME }}-ui:$shortSha"
          Write-Host "`nSecurity: Trivy scan completed"
          Write-Host "=========================================="

  deploy:
    name: Deploy to Kubernetes
    runs-on: [self-hosted, windows, x64]
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - name: Checkout BacktestingEngine
        uses: actions/checkout@v4
        with:
          path: BacktestingEngine

      - name: Check Kubernetes Connection
        shell: powershell
        run: |
          Write-Host "Verifying Kubernetes connection..."
          kubectl cluster-info
          kubectl get nodes
          Write-Host "✅ Kubernetes connection verified"

      - name: Fetch Secrets from Azure Key Vault
        shell: powershell
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
        run: |
          Write-Host "Fetching secrets from Azure Key Vault..."
          
          # Parse Azure credentials
          try {
            if ([string]::IsNullOrWhiteSpace($env:AZURE_CREDENTIALS)) {
              throw "AZURE_CREDENTIALS secret is empty or not set"
            }
            
            $creds = $env:AZURE_CREDENTIALS | ConvertFrom-Json -ErrorAction Stop
            
            # Validate required fields
            if (-not $creds.clientId -or -not $creds.clientSecret -or -not $creds.tenantId) {
              throw "Invalid Azure credentials format"
            }
            
            Write-Host "[OK] Azure credentials parsed successfully"
          } catch {
            Write-Error "Failed to parse Azure credentials: $($_.Exception.Message)"
            Write-Error "Please configure AZURE_CREDENTIALS secret in repository settings"
            exit 1
          }
          
          # Authenticate with Azure CLI
          try {
            Write-Host "[INFO] Authenticating with Azure..."
            $loginResult = az login --service-principal `
              --username $creds.clientId `
              --password $creds.clientSecret `
              --tenant $creds.tenantId `
              --output json 2>&1
            
            if ($LASTEXITCODE -ne 0) {
              throw "Azure CLI login failed with exit code $LASTEXITCODE"
            }
            
            Write-Host "[OK] Successfully authenticated with Azure"
          } catch {
            Write-Error "Azure authentication failed: $_"
            exit 1
          }
          
          # Fetch secrets
          $secretNames = @(
            "POSTGRES-HOST","POSTGRES-PORT","POSTGRES-USER","POSTGRES-PASSWORD","POSTGRES-DB",
            "ELASTIC-CLOUD-ENDPOINT","ELASTIC-CLOUD-USERNAME","ELASTIC-CLOUD-PASSWORD"
          )
          
          Write-Host "[INFO] Fetching $($secretNames.Count) secrets..."
          
          foreach ($secretName in $secretNames) {
            try {
              $envName = $secretName -replace "-", "_"
              $value = az keyvault secret show --vault-name $env:AZURE_KEYVAULT_NAME --name $secretName --query value -o tsv 2>&1
              
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($value)) {
                Write-Error "[FAIL] Failed to fetch secret $secretName"
                exit 1
              }
              
              $cleanValue = $value.Trim()
              echo "${envName}=${cleanValue}" >> $env:GITHUB_ENV
              Write-Host "[OK] Fetched $secretName"
            } catch {
              Write-Error "[FAIL] Error fetching $secretName : $_"
              exit 1
            }
          }
          
          Write-Host "[OK] All secrets fetched successfully"

      - name: Deploy to Kubernetes
        shell: powershell
        run: |
          Write-Host "Deploying BacktestingEngine to Kubernetes..."
          
          cd BacktestingEngine
          
          # Create namespace if it doesn't exist
          kubectl create namespace backtestingengine --dry-run=client -o yaml | kubectl apply -f -
          
          # Create image pull secret for GHCR
          Write-Host "[INFO] Creating image pull secret..."
          kubectl create secret docker-registry ghcr-secret `
            --docker-server=ghcr.io `
            --docker-username=${{ github.actor }} `
            --docker-password=${{ secrets.GITHUB_TOKEN }} `
            --namespace=backtestingengine `
            --dry-run=client -o yaml | kubectl apply -f -
          
          # Create Kubernetes secret from Azure Key Vault values
          Write-Host "[INFO] Creating application secrets in Kubernetes..."
          
          # Build DATABASE_URL first
          $databaseUrl = "postgresql://$($env:POSTGRES_USER):$($env:POSTGRES_PASSWORD)@$($env:POSTGRES_HOST):$($env:POSTGRES_PORT)/$($env:POSTGRES_DB)"
          
          kubectl create secret generic backtesting-secrets `
            --from-literal=database-username="$($env:POSTGRES_USER)" `
            --from-literal=database-password="$($env:POSTGRES_PASSWORD)" `
            --from-literal=database-host="$($env:POSTGRES_HOST)" `
            --from-literal=database-port="$($env:POSTGRES_PORT)" `
            --from-literal=database-name="$($env:POSTGRES_DB)" `
            --from-literal=DATABASE_URL="$databaseUrl" `
            --from-literal=elasticsearch-endpoint="$($env:ELASTIC_CLOUD_ENDPOINT)" `
            --from-literal=elasticsearch-username="$($env:ELASTIC_CLOUD_USERNAME)" `
            --from-literal=elasticsearch-password="$($env:ELASTIC_CLOUD_PASSWORD)" `
            --namespace=backtestingengine `
            --dry-run=client -o yaml | kubectl apply -f -
          
          Write-Host "[OK] Secrets synced to Kubernetes"
          
          # Install Nginx Ingress Controller if not present
          Write-Host "[INFO] Checking for Nginx Ingress Controller..."
          $ingressNs = kubectl get namespace ingress-nginx --ignore-not-found
          if ([string]::IsNullOrEmpty($ingressNs)) {
            Write-Host "[INFO] Installing Nginx Ingress Controller..."
            kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/cloud/deploy.yaml
            Write-Host "[INFO] Waiting for Ingress Controller to be ready..."
            kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=120s
            Write-Host "[OK] Ingress Controller installed"
          } else {
            Write-Host "[OK] Ingress Controller already installed"
          }
          
          # Build Helm arguments with commit SHA as image tag for immutability
          $imageTag = "${{ github.sha }}".Substring(0, 7)
          Write-Host "[INFO] Deploying with image tag: $imageTag"
          
          $helmArgs = @(
            "--namespace", "backtestingengine",
            "--create-namespace",
            "--set", "image.repository=${{ env.IMAGE_NAME }}",
            "--set", "image.tag=$imageTag",
            "--set", "image.pullPolicy=IfNotPresent",
            "--set", "imagePullSecrets[0].name=ghcr-secret",
            "--set", "global.imagePullSecrets[0].name=ghcr-secret",
            "--set", "ui.image.repository=${{ env.IMAGE_NAME }}-ui",
            "--set", "ui.image.tag=$imageTag",
            "--set", "ui.image.pullPolicy=IfNotPresent",
            "--set", "secrets.existingSecret=backtesting-secrets",
            "--wait",
            "--timeout", "18m"
          )
          
          Write-Host "[INFO] Using Kubernetes secret: backtesting-secrets"
          
          Write-Host "[INFO] Database and Elasticsearch configured"
          
          # Check and clear any stuck Helm operations
          Write-Host "[INFO] Checking Helm release status..."
          $ErrorActionPreference = 'SilentlyContinue'
          $helmList = helm list -n backtestingengine --all -o json | ConvertFrom-Json
          $ErrorActionPreference = 'Stop'
          
          if ($helmList -and $helmList.status -match "pending") {
            Write-Host "[WARN] Found stuck release in status: $($helmList.status)"
            
            if ($helmList.status -eq "pending-install") {
              Write-Host "[FIX] Deleting failed initial install..."
              helm uninstall backtesting-engine -n backtestingengine --wait --timeout 2m
            } else {
              Write-Host "[FIX] Rolling back stuck release..."
              helm rollback backtesting-engine -n backtestingengine --wait --timeout 2m
            }
            
            Start-Sleep -Seconds 5
            Write-Host "[OK] Release cleanup completed"
          } else {
            Write-Host "[OK] No stuck releases found"
          }
          
          # Use helm upgrade --install to handle both new and existing releases
          # --atomic: rollback automatically on failure
          # --cleanup-on-fail: delete resources created during failed upgrade
          Write-Host "Deploying with Helm (upgrade or install)..."
          helm upgrade --install backtesting-engine ./deployment/k8s/backtesting-engine-helm @helmArgs --atomic --cleanup-on-fail
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Deployment failed!"
            exit 1
          }
          
          Write-Host "Deployment successful!"
          
          # Setup Ingress for UI access
          Write-Host "[INFO] Configuring Ingress for UI..."
          kubectl apply -f ./deployment/k8s/backtesting-ui-ingress.yaml
          Write-Host "[OK] Ingress configured"

      - name: Verify Deployment
        shell: powershell
        run: |
          Write-Host "Verifying deployment..."
          
          Write-Host "`nPods:"
          kubectl get pods -n backtestingengine -o wide
          
          Write-Host "`nServices:"
          kubectl get services -n backtestingengine
          
          Write-Host "`nDeployments:"
          kubectl get deployments -n backtestingengine
          
          Write-Host "`nIngress:"
          kubectl get ingress -n backtestingengine
          
          Write-Host "`nDeployment verification complete!"

      - name: Deployment Summary
        shell: powershell
        run: |
          $imageTag = "${{ github.sha }}".Substring(0, 7)
          Write-Host "`n=========================================="
          Write-Host "Deployment Summary"
          Write-Host "=========================================="
          Write-Host "Namespace: backtestingengine"
          Write-Host "Release: backtesting-engine"
          Write-Host "Images (Immutable):"
          Write-Host "  - API: ${{ env.IMAGE_NAME }}:$imageTag"
          Write-Host "  - UI:  ${{ env.IMAGE_NAME }}-ui:$imageTag"
          Write-Host "`nSecrets: Kubernetes secret 'backtesting-secrets'"
          Write-Host "`nIngress: Nginx Ingress Controller installed"
          Write-Host "Access UI:"
          Write-Host "  - http://backtesting.local (add '192.81.111.116 backtesting.local' to local hosts file)"
          Write-Host "  - kubectl port-forward -n backtestingengine svc/backtesting-engine-ui 8000:80"
          Write-Host "`nRollback:"
          Write-Host "  helm rollback backtesting-engine -n backtestingengine"
          Write-Host "=========================================="
