name: BacktestingEngine CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        type: boolean
        default: false

# Prevent concurrent deployments
concurrency:
  group: backtesting-engine-${{ github.ref }}
  cancel-in-progress: false

# Grant minimal required permissions
permissions:
  contents: read
  packages: write
  security-events: write  # For security scan results

env:
  # Core configuration
  IMAGE_NAME: ghcr.io/nwagbara-group-llc/backtesting-engine
  
  # Performance optimization
  PARALLEL_JOBS: 3
  DOCKER_BUILDKIT: 1
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  # ===== VALIDATION & TESTING =====
  validate:
    name: Validate & Test
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 60
    outputs:
      tests-passed: ${{ steps.test-result.outputs.passed }}
      skip-tests: ${{ steps.check-skip.outputs.skip }}
    steps:
      - name: Checkout BacktestingEngine
        uses: actions/checkout@v4
        with:
          path: BacktestingEngine

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: databaseschema

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine

      - name: Verify Rust
        shell: powershell
        run: |
          Write-Host "Checking Rust installation..."
          rustc --version
          cargo --version

      - name: Check for Skip Tests Flag
        id: check-skip
        shell: powershell
        run: |
          cd BacktestingEngine
          $commitMsg = git log -1 --pretty=%B
          if ($commitMsg -match '\[skip-tests\]') {
            Write-Host "⏭️  [skip-tests] flag detected in commit message - skipping tests"
            echo "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Running full validation with tests"
            echo "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Target Directory
        uses: actions/cache@v4
        with:
          path: BacktestingEngine/target
          key: ${{ runner.os }}-target-backtesting-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-backtesting-

      - name: Fast Check (Syntax & Type Check)
        shell: powershell
        run: |
          Write-Host "Running fast cargo check (no codegen)..."
          cd BacktestingEngine
          cargo check --workspace --jobs 10
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Cargo check failed - syntax or type errors detected"
            exit 1
          }
          Write-Host "✅ Fast check passed!"

      - name: Build Workspace
        shell: powershell
        run: |
          Write-Host "Building BacktestingEngine workspace with parallel compilation..."
          cd BacktestingEngine
          cargo build --workspace --jobs 10
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Build failed!"
            exit 1
          }
          Write-Host "✅ Build passed!"

      - name: Run Tests
        if: steps.check-skip.outputs.skip != 'true'
        id: test-result
        shell: powershell
        run: |
          Write-Host "Running tests with parallel execution..."
          cd BacktestingEngine
          cargo test --workspace --jobs 10
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Tests passed!"
            echo "passed=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "❌ Tests failed!"
            echo "passed=false" >> $env:GITHUB_OUTPUT
            exit 1
          }

      - name: Skip Tests
        if: steps.check-skip.outputs.skip == 'true'
        id: skip-test-result
        shell: powershell
        run: |
          Write-Host "⏭️  Tests skipped due to [skip-tests] flag"
          echo "passed=true" >> $env:GITHUB_OUTPUT

      - name: Security Audit Dependencies
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Auditing Rust dependencies for vulnerabilities..."
          cd BacktestingEngine
          
          # Install cargo-audit if not present
          if (-not (cargo install --list | Select-String "cargo-audit")) {
            Write-Host "Installing cargo-audit..."
            cargo install cargo-audit
          }
          
          # Run audit - informational only, don't fail build
          cargo audit
          if ($LASTEXITCODE -ne 0) {
            Write-Host ""
            Write-Host "⚠️  WARNING: Security advisories detected in dependencies"
            Write-Host "Review the audit output above and update dependencies when new versions are available"
            Write-Host ""
          } else {
            Write-Host "✓ No known vulnerabilities detected"
          }

  # ===== BUILD & PUSH =====
  build:
    name: Build & Push
    runs-on: [self-hosted, windows, x64]
    needs: validate
    if: needs.validate.outputs.tests-passed == 'true' || github.event.inputs.skip_tests == 'true'
    timeout-minutes: 45
    outputs:
      image-exists: ${{ steps.image-check.outputs.exists }}
    steps:
      - name: Checkout BacktestingEngine
        uses: actions/checkout@v4
        with:
          path: BacktestingEngine
          fetch-depth: 0

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: databaseschema
          fetch-depth: 0

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Check Image Cache
        id: image-check
        shell: powershell
        run: |
          Write-Host "Checking if image exists for commit SHA..."
          
          $imageTag = "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          
          $ErrorActionPreference = 'SilentlyContinue'
          docker pull $imageTag 2>&1 | Out-Null
          $pullResult = $LASTEXITCODE
          
          if ($pullResult -eq 0) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "[OK] Image cache hit: $imageTag"
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "[INFO] Image cache miss, will build: $imageTag"
          }
          
          exit 0

      - name: Build & Push Image
        if: steps.image-check.outputs.exists != 'true'
        shell: powershell
        run: |
          Write-Host "Building BacktestingEngine Docker image..."
          $startTime = Get-Date
          
          # Verify dependencies
          $requiredDeps = @("databaseschema", "LoggingEngine")
          foreach ($dep in $requiredDeps) {
            if (Test-Path $dep) {
              Write-Host "[OK] Dependency found: $dep"
            } else {
              Write-Host "[ERROR] Missing dependency: $dep"
              exit 1
            }
          }
          
          # Create .dockerignore
          Write-Host "[SETUP] Creating .dockerignore..."
          $dockerignoreContent = @"
          **/.git/
          **/.gitignore
          **/.github/
          **/target/
          **/.vscode/
          **/.idea/
          **/*.swp
          **/.DS_Store
          **/.env
          **/.env.*
          **/*.md
          **/LICENSE
          **/Dockerfile
          **/.dockerignore
          **/docker-compose.yml
          **/compose.yaml
          BacktestingEngine/k8s/
          **/.cargo/
          **/Makefile
          "@
          
          Set-Content -Path ".dockerignore" -Value $dockerignoreContent
          Write-Host "[OK] .dockerignore created"
          
          # Build image
          Write-Host "[BUILD] Starting Docker build..."
          $buildStartTime = Get-Date
          
          try {
            docker build `
              --platform linux/amd64 `
              --tag ${{ env.IMAGE_NAME }}:latest `
              --tag ${{ env.IMAGE_NAME }}:${{ github.sha }} `
              --file BacktestingEngine/Dockerfile `
              --build-arg BUILDKIT_INLINE_CACHE=1 `
              --progress=plain `
              .
              
            if ($LASTEXITCODE -ne 0) {
              throw "Docker build failed with exit code $LASTEXITCODE"
            }
            
            $buildDuration = (Get-Date) - $buildStartTime
            $durationMinutes = [math]::Round($buildDuration.TotalMinutes, 1)
            Write-Host "[OK] Docker build completed in $durationMinutes minutes"
            
          } catch {
            Write-Host "[FAIL] Docker build failed!"
            throw $_
          }
          
          # Push images
          Write-Host "[PUSH] Pushing images to GHCR..."
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          $duration = (Get-Date) - $startTime
          $durationMinutes = [math]::Round($duration.TotalMinutes, 1)
          Write-Host "[OK] Build & push completed in $durationMinutes minutes"

      - name: Tag Existing Image
        if: steps.image-check.outputs.exists == 'true'
        shell: powershell
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:latest
          Write-Host "[OK] Tagged existing image as latest"

      - name: Validate Image
        shell: powershell
        run: |
          Write-Host "Validating pushed image..."
          
          # Pull and inspect
          docker pull ${{ env.IMAGE_NAME }}:latest
          
          $imageSize = docker inspect ${{ env.IMAGE_NAME }}:latest --format='{{.Size}}' | ForEach-Object { [math]::Round($_ / 1MB, 1) }
          Write-Host "[INFO] Image size: $imageSize MB"
          
          # Verify critical files exist in image
          Write-Host "[CHECK] Verifying image contents..."
          docker run --rm ${{ env.IMAGE_NAME }}:latest ls -la /app/program
          
          Write-Host "[OK] Image validation complete"

      - name: Output Summary
        shell: powershell
        run: |
          Write-Host "`n=========================================="
          Write-Host "Build Summary"
          Write-Host "=========================================="
          Write-Host "Image: ${{ env.IMAGE_NAME }}"
          Write-Host "Tags:"
          Write-Host "  - latest"
          Write-Host "  - ${{ github.sha }}"
          Write-Host "`nPull commands:"
          Write-Host "  docker pull ${{ env.IMAGE_NAME }}:latest"
          Write-Host "  docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          Write-Host "=========================================="
