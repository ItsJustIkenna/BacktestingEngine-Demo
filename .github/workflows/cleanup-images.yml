name: Cleanup Old Container Images

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    name: Delete Old Images
    
    steps:
      - name: Delete old API images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'backtesting-engine'
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
          
      - name: Delete old UI images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'backtesting-engine-ui'
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
          
      - name: Cleanup Summary
        run: |
          echo "✅ Cleaned up old container images"
          echo "📦 Kept last 10 versions of each image"
          echo "🗑️ Deleted images older than 10 releases"
