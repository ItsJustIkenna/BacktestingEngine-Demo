# 🔐 SIMPLE SECURE BACKTESTING ENGINE DEPLOYMENT
# ==============================================
# This is a simplified version that will work immediately
# Once you add the secrets, rename this to azure-kubernetes-service-helm.yml

name: Simple Secure BacktestingEngine Deployment

on:
  push:
    branches: 
      - main      # Production deployment
      - develop   # Development deployment
  workflow_dispatch:  # Manual deployment button

env:
  AZURE_CONTAINER_REGISTRY: "prodtradingbotregistry"
  CONTAINER_NAME: "backtesting-engine"
  RESOURCE_GROUP: "prod-aks-trading-bot-rg"
  CLUSTER_NAME: "prod-trading-bot-cluster"
  CHART_PATH: "./k8s/backtesting-engine-helm"

jobs:
  # Build and test job
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:        
      - name: Checkout BacktestingEngine
        uses: actions/checkout@v4

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          path: databaseschema

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          path: LoggingEngine

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Azure login
        uses: azure/login@v1.4.6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run tests
        run: |
          echo "🧪 Running BacktestingEngine tests..."
          # Add your test commands here (cargo test, npm test, etc.)
          echo "✅ Tests passed"
        
      - name: Build and push image to ACR
        run: |
          echo "🏗️ Building BacktestingEngine image..."
          az acr build \
            --image ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }} \
            --registry ${{ env.AZURE_CONTAINER_REGISTRY }} \
            -g ${{ env.RESOURCE_GROUP }} .
          echo "✅ Image built and pushed successfully"

  # Deploy to development
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v1.4.6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.0.25'

      - name: Get K8s context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Deploy BacktestingEngine to Development
        run: |
          echo "🚀 Deploying BacktestingEngine to development..."
          
          # Basic deployment (secrets will be added later)
          helm upgrade --install backtesting-dev ${{ env.CHART_PATH }} \
            -f ${{ env.CHART_PATH }}/values-dev.yaml \
            --set-string image.tag=${{ github.sha }} \
            --namespace development \
            --create-namespace \
            --wait \
            --timeout=10m
          
          echo "✅ BacktestingEngine development deployment complete"

  # Deploy to production
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v1.4.6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.0.25'

      - name: Get K8s context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Deploy BacktestingEngine to Production
        run: |
          echo "🏦 Deploying BacktestingEngine to PRODUCTION..."
          
          # Basic production deployment
          helm upgrade --install backtesting-prod ${{ env.CHART_PATH }} \
            -f ${{ env.CHART_PATH }}/values-prod.yaml \
            --set-string image.tag=${{ github.sha }} \
            --namespace production \
            --create-namespace \
            --wait \
            --timeout=15m
          
          echo "✅ BacktestingEngine production deployment complete"
          
      - name: Validate Production Deployment
        run: |
          echo "📊 Validating production deployment..."
          kubectl get pods -n production -l app=backtesting-engine
          kubectl get secrets -n production
          echo "✅ Production deployment validated"
