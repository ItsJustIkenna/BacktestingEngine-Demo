[package]
name = "metrics"
version = "0.1.0"
edition = "2021"

[features]
default = []
persistence = ["diesel", "diesel-async", "uuid", "bigdecimal", "databaseschema"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

# Logging
ultra-logger = { path = "../../LoggingEngine/ultra-logger" }
once_cell = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.0"
config = { path = "../config" }

# Database persistence dependencies (optional)
diesel = { version = "2.2", features = ["postgres", "uuid", "chrono", "r2d2", "numeric"], optional = true }
diesel-async = { version = "0.5", features = ["postgres", "deadpool"], optional = true }
uuid = { version = "1.0", features = ["v4", "serde"], optional = true }
bigdecimal = { version = "0.4", features = ["serde"], optional = true }
databaseschema = { path = "../../databaseschema", optional = true }
