# ⚠️ WARNING: This docker-compose.yml is for LOCAL DEVELOPMENT ONLY
# For all deployed environments (dev/staging/prod), use Helm charts:
#   helm install backtesting-engine ./k8s/backtesting-engine-helm -f values-{env}.yaml
# See DEPLOYMENT.md for details

version: '3.8'

services:
  backtesting-engine:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "${UI_PORT:-80}:80"      # React UI
      - "${API_PORT:-8080}:8080"  # API Backend
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - DATABASE_URL=postgresql://${POSTGRES_USERNAME:-backtesting}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-backtesting_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - NUM_WORKERS=${NUM_WORKERS:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-backtesting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-backtesting_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backtesting -d backtesting_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
