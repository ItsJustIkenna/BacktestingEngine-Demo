
[workspace]
resolver = "2"
members = [
    # Core Engine Components
    "backtest",          # Main backtesting engine with simulation
    "metrics",           # Performance metrics calculation
    "smartrouter",       # Smart order routing across venues
    
    # Strategy & Optimization
    "strategy",          # Trading strategy implementations
    "genetic",           # Genetic algorithm optimization
    "walkforward",       # Walk-forward analysis & validation
    
    # Trading Infrastructure
    "orderbook",         # Order book management & matching engine
    "portfoliomanager",  # Portfolio state & position tracking
    "riskmanager",       # Risk limits & controls
    "signal",            # Signal generation & management
    
    # Data & Configuration
    "dataloader",        # Market data loading from database
    "data_prep",         # Data preparation for backtesting (binary files)
    "config",            # Configuration management
    
    # Applications
    "program",           # CLI application (TODO: rename to 'cli')
]
