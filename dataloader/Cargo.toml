[package]
name = "dataloader"
version = "0.1.0"
edition = "2021"

[features]
default = []
postgres = ["dep:diesel", "dep:diesel-async", "databaseschema"]

[dependencies]
config = { path = "../config" }
databaseschema = { path = "../local/databaseschema", optional = true }
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bigdecimal = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
diesel = { version = "2.2", features = ["postgres", "uuid", "chrono", "numeric"], optional = true }
diesel-async = { version = "0.5", features = ["postgres", "deadpool"], optional = true }
deadpool = { version = "0.12", features = ["managed"] }
log = "0.4"
rand = { version = "0.8", features = ["std_rng"] }
tokio-retry = "0.3"
futures = "0.3"
fastrand = "2.0"
tracing = "0.1"
flate2 = "1.0"
# Logging
ultra-logger = { path = "../local/ultra-logger" }
once_cell = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "dataloader_benchmark"
harness = false
