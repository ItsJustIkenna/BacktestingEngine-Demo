apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backtesting-engine.fullname" . }}-secret
  labels:
    {{- include "backtesting-engine.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace | quote }}
type: Opaque
data:
  # Database credentials (base64 encoded)
  database-password: {{ .Values.config.database.password | b64enc | quote }}
  {{- if .Values.redis.enabled }}
  redis-password: {{ .Values.config.redis.password | b64enc | quote }}
  {{- end }}
  
  # Application secrets
  {{- if .Values.config.secrets.jwt_secret }}
  jwt-secret: {{ .Values.config.secrets.jwt_secret | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.config.secrets.encryption_key }}
  encryption-key: {{ .Values.config.secrets.encryption_key | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.config.secrets.api_keys }}
  {{- range $key, $value := .Values.config.secrets.api_keys }}
  api-key-{{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}

stringData:
  # Connection strings
  database-url: "postgresql://{{ include "backtesting-engine.postgresql.username" . }}:{{ .Values.config.database.password }}@{{ include "backtesting-engine.postgresql.servicename" . }}:{{ include "backtesting-engine.postgresql.port" . }}/{{ include "backtesting-engine.postgresql.database" . }}"
  {{- if .Values.redis.enabled }}
  redis-url: "redis://{{ include "backtesting-engine.redis.servicename" . }}:{{ include "backtesting-engine.redis.port" . }}"
  {{- end }}
