apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-optimization
  namespace: backtesting-engine
spec:
  # Run at 2 AM UTC every Sunday
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: parameter-sweep
            image: curlimages/curl:latest
            env:
            - name: API_URL
              value: "http://backtesting-engine-service:8080"
            command:
            - /bin/sh
            - -c
            - |
              # Parameter sweep for risk_aversion values
              echo "Starting parameter sweep optimization..."
              
              for risk_aversion in 0.3 0.4 0.5 0.6 0.7; do
                for inventory_target in 0.4 0.5 0.6; do
                  echo "Testing risk_aversion=${risk_aversion}, inventory_target=${inventory_target}"
                  
                  curl -X POST "${API_URL}/api/backtest" \
                    -H "Content-Type: application/json" \
                    -d "{
                      \"symbol\": \"BTC-USD\",
                      \"exchange\": \"Binance\",
                      \"risk_aversion\": ${risk_aversion},
                      \"inventory_target\": ${inventory_target},
                      \"order_size\": 0.01,
                      \"initial_capital\": 100000,
                      \"commission_rate\": 0.001
                    }"
                  
                  # Small delay between submissions
                  sleep 2
                done
              done
              
              echo "Parameter sweep completed: 15 backtests submitted"
