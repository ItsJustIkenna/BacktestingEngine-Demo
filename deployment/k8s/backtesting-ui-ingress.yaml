apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backtesting-engine-ui-ingress
  namespace: backtestingengine
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"  # Allow large Tardis CSV uploads
spec:
  ingressClassName: nginx
  rules:
  - host: backtesting.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backtesting-engine-ui
            port:
              number: 80
