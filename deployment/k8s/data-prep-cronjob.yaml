apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: historical-data-pvc
  namespace: backtesting
spec:
  accessModes:
    - ReadWriteMany  # Allows multiple pods to read simultaneously
  storageClassName: standard  # Adjust based on your cluster
  resources:
    requests:
      storage: 50Gi  # 7M ticks × 48 bytes × ~10 symbols ≈ 3.5GB, plus headroom
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-prep
  namespace: backtesting
  labels:
    app: backtesting-engine
    component: data-prep
spec:
  # Run at 2 AM UTC daily
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid  # Don't run if previous job still running
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200  # 2 hour timeout
      template:
        metadata:
          labels:
            app: backtesting-engine
            component: data-prep
        spec:
          restartPolicy: OnFailure
          containers:
            - name: data-prep
              image: backtesting-engine:latest
              imagePullPolicy: Always
              command:
                - /app/backtesting-engine
              args:
                - prepare-data
                - --symbol
                - "BTC/USD"
                - --exchange
                - "Kraken"
                - --output-dir
                - /data/historical
                - --chunk-size
                - "10000"
                - --compute-features
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: backtesting-secrets
                      key: database-url
                - name: RUST_LOG
                  value: "info,data_prep=debug"
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "250m"
                limits:
                  memory: "2Gi"
                  cpu: "1000m"
              volumeMounts:
                - name: historical-data
                  mountPath: /data/historical
          volumes:
            - name: historical-data
              persistentVolumeClaim:
                claimName: historical-data-pvc
---
# Additional job for ETH/USD (can add more symbols)
