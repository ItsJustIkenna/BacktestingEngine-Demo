# =============================================================================
# BacktestingEngine Helm Chart Values
# High-Performance Trading Strategy Backtesting Platform
# =============================================================================

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# =============================================================================
# Application Configuration
# =============================================================================

# Application metadata
appName: backtesting-engine
fullnameOverride: ""
nameOverride: ""

# Image configuration
image:
  repository: backtesting-engine
  tag: "latest"
  pullPolicy: Always
  pullSecrets: 
    - ghcr-secret

# Deployment configuration  
replicaCount: 1
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# API Server configuration (separate from workers)
api:
  replicaCount: 1
  enabled: true
  service:
    type: ClusterIP
    port: 8080

# UI configuration
ui:
  replicaCount: 2
  enabled: true
  image:
    repository: backtesting-engine-ui
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: "200m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# Resource Management
# =============================================================================

# Resource requests and limits
resources:
  limits:
    cpu: "4000m"      # Increased for better performance
    memory: "8Gi"     # Increased for genetic algorithm and Monte Carlo
  requests:
    cpu: "2000m"      # Higher baseline for faster processing
    memory: "4Gi"     # More memory for parallel operations

# Node selection
nodeSelector: {}
  # Uncomment to use CPU-optimized nodes:
  # node.kubernetes.io/instance-type: "c5.4xlarge"
  
tolerations: []
affinity: {}

# =============================================================================
# External Database Configuration
# =============================================================================

# Secrets (injected at deployment time from Azure Key Vault or CI/CD)
secrets:
  # Database credentials
  database:
    enabled: true
    # Credentials injected via --set-string parameters at deployment time
    # Example: --set-string secrets.database.username=$POSTGRES_USER
    #          --set-string secrets.database.password=$POSTGRES_PASSWORD
    #          --set-string secrets.database.url=$DATABASE_URL
    username: ""  # Injected at deployment
    password: ""  # Injected at deployment
    url: ""       # Full connection string, injected at deployment
  
  # Elasticsearch credentials (optional for logging)
  elasticsearch:
    enabled: false
    endpoint: ""
    username: ""
    password: ""

externalDatabase:
  enabled: true
  host: "postgresql"  # Override via --set or environment values
  port: 5432
  database: "backtesting"
  username: "backtesting"
  existingSecret: ""  # Use Helm-generated secret
  # password: ""  # SECURE: Set via secrets.database.password

# Disable built-in databases (use external)
postgresql:
  enabled: false

# =============================================================================
# Networking & Service Configuration
# =============================================================================

# Service configuration
service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080
  uiPort: 80
  uiTargetPort: 80
  metricsPort: 9090
  ports:
    - name: ui
      port: 80
      targetPort: 80
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: backtesting-engine.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# =============================================================================
# Application Configuration
# =============================================================================

config:
  environment: production
  logging:
    level: info
    format: json
    file_enabled: true
    file_path: "/var/log/backtesting/app.log"
  performance:
    worker_threads: 4
  database:
    host: "host.docker.internal"  # Override at deployment
    port: 5432
    database: "backtesting"
    username: "postgres"  # Override at deployment
    max_connections: 20        # Increased from 10 for better parallelization
    connection_timeout: 30
    pool_size: 20              # New: connection pool size
    max_lifetime: 1800         # New: max connection lifetime (30 min)
    idle_timeout: 600          # New: idle connection timeout (10 min)
  trading:
    commission_rate: 0.001
    slippage_bps: 5
    initial_capital: 100000
    max_position_size: 0.25
    risk_free_rate: 0.04
  data:
    default_timeframe: "1h"
    data_sources:
      - "binance"
      - "coinbase"
    cache_enabled: true
    cache_duration_hours: 24
  output:
    results_dir: "/tmp/backtest_results"
    reports_dir: "/tmp/backtest_reports"
    charts_enabled: true
    export_formats:
      - "json"
      - "csv"
  genetic:
    population_size: 100
    generations: 50
    mutation_rate: 0.1
    crossover_rate: 0.7
    elite_size: 10
  walkforward:
    optimization_window_days: 90
    test_window_days: 30
    step_size_days: 30
    min_trades_per_period: 10
  risk:
    max_drawdown: 0.2
    max_position_size: 0.25
    stop_loss: 0.05
    var_confidence: 0.95
  secrets:
    jwt_secret: ""
    encryption_key: ""

# Environment variables
env: []
  # - name: RUST_LOG
  #   value: "info"

# =============================================================================
# Security Configuration
# =============================================================================

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# =============================================================================
# Storage Configuration
# =============================================================================

persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  logs:
    enabled: false
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    annotations: {}
    volumeMode: "Filesystem"

# =============================================================================
# Monitoring Configuration
# =============================================================================

metrics:
  enabled: true
  port: 9090

# =============================================================================
# Autoscaling Configuration
# =============================================================================

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Scale up quickly for burst workloads, scale down slowly to maintain capacity
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 120
      selectPolicy: Min

# =============================================================================
# Pod Disruption Budget
# =============================================================================

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# =============================================================================
# Health Checks
# =============================================================================

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# =============================================================================
# Additional Configuration
# =============================================================================

# Job configuration (for one-time backtest runs)
job:
  enabled: false  # Set to true to create a Job instead of Deployment
  name: "backtest"
  annotations: {}

# CronJob configuration (for scheduled backtest runs)
cronjob:
  enabled: false
  schedule: "0 0 * * *"  # Daily at midnight
  timezone: "UTC"
  annotations: {}
  startingDeadlineSeconds: 300
  concurrencyPolicy: "Forbid"
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  job:
    ttlSecondsAfterFinished: 86400  # 24 hours
    activeDeadlineSeconds: 3600  # 1 hour
    backoffLimit: 3

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Deployment annotations
annotations: {}
