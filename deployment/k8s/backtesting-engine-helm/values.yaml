# =============================================================================
# BacktestingEngine Helm Chart Values
# High-Performance Trading Strategy Backtesting Platform
# =============================================================================

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# =============================================================================
# Application Configuration
# =============================================================================

# Application metadata
appName: backtesting-engine
fullnameOverride: ""
nameOverride: ""

# Image configuration
image:
  repository: backtesting-engine
  tag: "latest"
  pullPolicy: IfNotPresent
  pullSecrets: []

# Deployment configuration  
replicaCount: 1
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# API Server configuration (separate from workers)
api:
  replicaCount: 1
  enabled: true
  service:
    type: ClusterIP
    port: 8080

# UI configuration
ui:
  replicaCount: 2
  enabled: true
  image:
    repository: backtesting-engine-ui
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: "200m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# Resource Management
# =============================================================================

# Resource requests and limits
resources:
  limits:
    cpu: "1000m"
    memory: "2Gi"
  requests:
    cpu: "500m"
    memory: "1Gi"

# Node selection
nodeSelector: {}
tolerations: []
affinity: {}

# =============================================================================
# External Database Configuration
# =============================================================================

# Secrets (injected at deployment time from Azure Key Vault or CI/CD)
secrets:
  # Database credentials
  database:
    enabled: true
    # Credentials injected via --set-string parameters at deployment time
    # Example: --set-string secrets.database.username=$POSTGRES_USER
    #          --set-string secrets.database.password=$POSTGRES_PASSWORD
    #          --set-string secrets.database.url=$DATABASE_URL
    username: ""  # Injected at deployment
    password: ""  # Injected at deployment
    url: ""       # Full connection string, injected at deployment
  
  # Elasticsearch credentials (optional for logging)
  elasticsearch:
    enabled: false
    endpoint: ""
    username: ""
    password: ""

externalDatabase:
  enabled: true
  host: "postgresql"  # Override via --set or environment values
  port: 5432
  database: "backtesting"
  username: "backtesting"
  existingSecret: ""  # Use Helm-generated secret
  # password: ""  # SECURE: Set via secrets.database.password

# Disable built-in databases (use external)
postgresql:
  enabled: false

# =============================================================================
# Networking & Service Configuration
# =============================================================================

# Service configuration
service:
  enabled: true
  type: ClusterIP
  ports:
    - name: ui
      port: 80
      targetPort: 80
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: backtesting-engine.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# =============================================================================
# Application Configuration
# =============================================================================

config:
  environment: production
  logging:
    level: info
    format: json
  performance:
    worker_threads: 4
  database:
    host: "host.docker.internal"  # Override at deployment
    port: 5432
    database: "backtesting"

# Environment variables
env: []
  # - name: RUST_LOG
  #   value: "info"

# =============================================================================
# Security Configuration
# =============================================================================

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# =============================================================================
# Storage Configuration
# =============================================================================

persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

# =============================================================================
# Monitoring Configuration
# =============================================================================

metrics:
  enabled: true
  port: 9090

# =============================================================================
# Autoscaling Configuration
# =============================================================================

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# =============================================================================
# Pod Disruption Budget
# =============================================================================

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# =============================================================================
# Health Checks
# =============================================================================

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# =============================================================================
# Additional Configuration
# =============================================================================

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Deployment annotations
annotations: {}
