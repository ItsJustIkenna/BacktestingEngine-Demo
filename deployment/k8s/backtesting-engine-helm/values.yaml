# =============================================================================
# BacktestingEngine Helm Chart Values
# High-Performance Trading Strategy Backtesting Platform
# =============================================================================

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# =============================================================================
# Application Configuration
# =============================================================================

# Application metadata
appName: backtesting-engine
fullnameOverride: ""
nameOverride: ""

# Image configuration
image:
  repository: backtesting-engine
  tag: "latest"
  pullPolicy: Always
  pullSecrets: 
    - ghcr-secret

# Deployment configuration  
replicaCount: 1
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# API Server configuration (separate from workers)
api:
  replicaCount: 1
  enabled: true
  service:
    type: ClusterIP
    port: 8080
  # API pod resource limits - reduced for Docker Desktop compatibility
  resources:
    limits:
      cpu: "1000m"
      memory: "2Gi"      # Reduced for Docker Desktop (increase for larger runs)
    requests:
      cpu: "250m"
      memory: "1Gi"      # Reduced for Docker Desktop scheduling

# UI configuration
ui:
  replicaCount: 2
  enabled: true
  image:
    repository: backtesting-engine-ui
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer  # Changed from ClusterIP - gives public IP
    port: 80
  resources:
    limits:
      cpu: "200m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# Resource Management
# =============================================================================

# Resource requests and limits
# Portfolio backtests with 3+ symbols require significant memory during data loading
resources:
  limits:
    cpu: "4000m"      # 4 CPU cores for parallel processing
    memory: "32Gi"    # 32GB for portfolio GA with multiple symbols
  requests:
    cpu: "500m"       # 0.5 core guaranteed (lower request = easier to schedule)
    memory: "16Gi"    # 16GB baseline for portfolio data loading

# Node selection
nodeSelector: {}
  # Uncomment to use CPU-optimized nodes:
  # node.kubernetes.io/instance-type: "c5.4xlarge"
  
tolerations: []
affinity: {}

# =============================================================================
# External Database Configuration
# =============================================================================

# Secrets (injected at deployment time from Azure Key Vault or CI/CD)
secrets:
  # Use an existing Kubernetes secret (recommended for real deployments)
  # If specified, the secret should contain these keys:
  #   - database-username
  #   - database-password
  #   - database-host
  #   - database-port
  #   - database-name
  #   - elasticsearch-endpoint (optional)
  #   - elasticsearch-username (optional)
  #   - elasticsearch-password (optional)
  existingSecret: ""  # Set to "backtesting-secrets" to use existing K8s secret
  
  # Database credentials (legacy - only used if existingSecret is not set)
  database:
    enabled: true
    # Credentials injected via --set-string parameters at deployment time
    # Example: --set-string secrets.database.username=$POSTGRES_USER
    #          --set-string secrets.database.password=$POSTGRES_PASSWORD
    #          --set-string secrets.database.url=$DATABASE_URL
    username: ""  # Injected at deployment
    password: ""  # Injected at deployment
    url: ""       # Full connection string, injected at deployment
  
  # Elasticsearch credentials (optional for logging)
  elasticsearch:
    enabled: true
    endpoint: "https://your-elasticsearch-endpoint.example.com"
    username: "elastic"
    password: "CHANGE_ME"

externalDatabase:
  enabled: true
  host: "postgresql"  # Override via --set or environment values
  port: 5432
  database: "backtesting"
  username: "backtesting"
  existingSecret: ""  # Deprecated: Use secrets.existingSecret instead
  # password: ""  # SECURE: Set via secrets.database.password

# Disable built-in databases (use external)
postgresql:
  enabled: false

# =============================================================================
# Networking & Service Configuration
# =============================================================================

# Service configuration
service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080
  uiPort: 80
  uiTargetPort: 80
  metricsPort: 9090
  ports:
    - name: ui
      port: 80
      targetPort: 80
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"  # Allow large Tardis CSV uploads
  hosts:
    - host: backtesting-engine.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# =============================================================================
# Application Configuration
# =============================================================================

config:
  environment: production
  logging:
    level: info
    format: json
    file_enabled: true
    file_path: "/var/log/backtesting/app.log"
  performance:
    # Worker threads per pod - reduced to 1 to prevent OOM
    # Each backtest uses ~15-20GB with full 6.8M data points + parallel evaluations
    # With 32GB limit, only 1 concurrent backtest is safe
    worker_threads: 1
  database:
    host: ""  # Required: Set via --set config.database.host or Azure Key Vault
    port: 5432
    database: "backtesting"
    username: "postgres"  # Override at deployment
    max_connections: 20        # Increased from 10 for better parallelization
    connection_timeout: 30
    pool_size: 20              # New: connection pool size
    max_lifetime: 1800         # New: max connection lifetime (30 min)
    idle_timeout: 600          # New: idle connection timeout (10 min)
  trading:
    commission_rate: 0.001
    slippage_bps: 5
    initial_capital: 100000
    max_position_size: 0.25
    risk_free_rate: 0.04
  data:
    default_timeframe: "1h"
    data_sources:
      - "kraken"
    cache_enabled: true
    cache_duration_hours: 24
  output:
    results_dir: "/tmp/backtest_results"
    reports_dir: "/tmp/backtest_reports"
    charts_enabled: true
    export_formats:
      - "json"
      - "csv"
  genetic:
    population_size: 100
    generations: 50
    mutation_rate: 0.1
    crossover_rate: 0.7
    elite_size: 10
  walkforward:
    optimization_window_days: 90
    test_window_days: 30
    step_size_days: 30
    min_trades_per_period: 10
  risk:
    max_drawdown: 0.2
    max_position_size: 0.25
    stop_loss: 0.05
    var_confidence: 0.95
  secrets:
    jwt_secret: ""
    encryption_key: ""

# Environment variables
env: []
  # - name: RUST_LOG
  #   value: "info"

# =============================================================================
# Security Configuration
# =============================================================================

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# =============================================================================
# Storage Configuration
# =============================================================================

persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  logs:
    enabled: false
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    annotations: {}
    volumeMode: "Filesystem"

# =============================================================================
# Monitoring Configuration
# =============================================================================

metrics:
  enabled: true
  port: 9090

# =============================================================================
# Autoscaling Configuration
# =============================================================================
# NOTE: Main coordinator autoscaling is DISABLED to avoid HPA selector conflicts
# with distributed workers. Only distributed workers need HPA for scaling.

autoscaling:
  enabled: false      # Disabled - coordinator doesn't need autoscaling
  minReplicas: 1      # Start with 1 pod to ensure scheduling, HPA scales up as needed
  maxReplicas: 4      # Max 4 pods (each with 32GB = 128GB total)
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Scale up quickly for burst workloads, scale down slowly to maintain capacity
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 120
      selectPolicy: Min

# =============================================================================
# Pod Disruption Budget
# =============================================================================

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# =============================================================================
# Health Checks
# =============================================================================

livenessProbe:
  enabled: false  # Workers are long-running background processors, no HTTP health endpoint
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  # Use exec probe for worker mode (no HTTP server)
  # Check if PID 1 is running (main container process) via /proc
  # This works in minimal containers without pgrep/ps
  exec:
    command:
      - /bin/sh
      - -c
      - test -d /proc/1
  # httpGet is used for API mode (commented out for worker deployments)
  # httpGet:
  #   path: /health
  #   port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# =============================================================================
# Additional Configuration
# =============================================================================

# Job configuration (for one-time backtest runs)
job:
  enabled: false  # Set to true to create a Job instead of Deployment
  name: "backtest"
  annotations: {}

# CronJob configuration (for scheduled backtest runs)
cronjob:
  enabled: false
  schedule: "0 0 * * *"  # Daily at midnight
  timezone: "UTC"
  annotations: {}
  startingDeadlineSeconds: 300
  concurrencyPolicy: "Forbid"
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  job:
    ttlSecondsAfterFinished: 86400  # 24 hours
    activeDeadlineSeconds: 3600  # 1 hour
    backoffLimit: 3

# =============================================================================
# Distributed GA Configuration
# =============================================================================
# Enable distributed genetic algorithm for parallel chromosome evaluation
# across multiple worker pods using MessageBrokerEngine TCP connections.
# 
# The broker client now supports network mode via TCP connections.
# Set MESSAGE_BROKER_URL to enable cross-pod communication.

distributedGA:
  # Enable distributed GA mode
  enabled: true
  
  # Minimum workers required to start distributed evaluation
  minWorkers: 2
  
  # MessageBrokerEngine TCP wire protocol URL
  # Port 8081 is the TCP broker for distributed backtest communication
  brokerUrl: "tcp://message-broker-engine.messagebroker.svc.cluster.local:8081"
  
  # Timeout waiting for workers to connect (seconds)
  workerTimeout: 30

# =============================================================================
# Distributed Worker Configuration
# =============================================================================
# Distributed workers process chunks in parallel across multiple pods
# This enables scaling backtests from millions to billions of events

distributedWorker:
  # Enable distributed worker deployment
  enabled: true
  
  # Number of worker replicas - increased to compensate for reduced parallelism
  replicaCount: 4
  
  # Number of threads per worker pod
  # Reduced to 1 to prevent OOM - each backtest uses ~1.5GB+ memory with 7M data points
  threads: 1
  
  # Note: MessageBrokerEngine URL is configured in distributedGA.brokerUrl
  
  # Historical data configuration
  # Workers load pre-prepared binary files via mmap for 10x memory reduction
  historicalData:
    enabled: true
    # PVC containing binary files from data-prep cronjob
    pvcName: "historical-data-pvc"
    # Mount path (also set as DATA_DIR env var)
    mountPath: "/data/historical"
    # Storage size for binary data files
    size: "10Gi"
    # Init job to auto-populate PVC on first deployment
    initJob:
      enabled: true
      symbol: "BTC/USD"
      exchange: "Kraken"
  
  # Resource limits for distributed workers
  # With mmap binary files: 336MB data + evaluation headroom
  resources:
    limits:
      cpu: "4000m"        # 4 cores for parallel chromosome evaluation
      memory: "4Gi"       # Reduced - mmap files don't count toward RSS
    requests:
      cpu: "1000m"        # Increased request for better scheduling
      memory: "1Gi"       # Reduced - mmap files are shared
  
  # Autoscaling configuration
  autoscaling:
    enabled: true
    minReplicas: 3        # More workers for faster GA evaluation
    maxReplicas: 16
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  # Node selection for distributed workers
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Deployment annotations
annotations: {}

