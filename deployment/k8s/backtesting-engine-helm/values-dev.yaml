# =============================================================================
# BacktestingEngine Development Environment Values
# Local development with minimal resources
# =============================================================================

# Environment marker
environment: development

# Single replica for dev
replicaCount: 1

# Image configuration - use local image
image:
  repository: backtesting-engine
  pullPolicy: IfNotPresent
  tag: "latest"

# Resource allocation for development
# Increased for parallel Monte Carlo (Rayon) and genetic optimization
resources:
  limits:
    cpu: "4000m"      # 4 CPU cores for parallel processing
    memory: "8Gi"      # 8GB for genetic optimization (50 chromosomes)
  requests:
    cpu: "2000m"      # 2 CPU cores minimum
    memory: "4Gi"      # 4GB minimum

# =============================================================================
# Secrets Configuration - Local Development
# =============================================================================
# For local dev, database runs on host.docker.internal
# Database URL format: postgresql://username:password@host:port/database

secrets:
  database:
    enabled: true
    # Azure TimescaleDB (production database)
    username: "tsdbadmin"
    password: "m1jgd4o66synfmi8"
    url: "postgresql://tsdbadmin:m1jgd4o66synfmi8@ha42vyxkd7.yd4ed8gjcp.tsdb.cloud.timescale.com:39470/tsdb"
  
  elasticsearch:
    enabled: true
    endpoint: "https://trading-bot-observability-6b76eb.es.us-central1.gcp.cloud.es.io"
    username: "elastic"
    password: "iXMYLAxROoLWzmxerC0V1ivR"

# External database configuration
externalDatabase:
  enabled: true
  host: "host.docker.internal"  # Docker Desktop host
  port: 5432
  database: "backtesting"
  username: "backtesting"
  existingSecret: ""

# Disable built-in PostgreSQL
postgresql:
  enabled: false

# =============================================================================
# Service Configuration
# =============================================================================

service:
  enabled: true
  type: ClusterIP
  uiPort: 80
  uiTargetPort: 80
  port: 8080
  targetPort: 8080
  metricsPort: 9090
  ports:
    - name: ui
      port: 80
      targetPort: 80
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP

# =============================================================================
# Health Checks
# =============================================================================

livenessProbe:
  enabled: false  # Workers are long-running background processors, no HTTP health endpoint
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# =============================================================================
# Application Configuration
# =============================================================================

config:
  environment: development
  logging:
    level: debug
    format: json
    file_enabled: false
    file_path: "/var/log/backtesting.log"
  
  # Trading parameters for backtesting
  trading:
    commission_rate: 0.001  # 0.1%
    slippage_bps: 5  # 5 basis points
    initial_capital: 100000
    max_position_size: 0.25  # 25% of portfolio
    risk_free_rate: 0.02  # 2% annually
  
  # Data configuration
  data:
    default_timeframe: "1d"
    data_sources:
      - "local"
      - "csv"
    cache_enabled: true
    cache_duration_hours: 24
  
  # Output configuration
  output:
    results_dir: "/app/results"
    reports_dir: "/app/reports"
    charts_enabled: true
    export_formats:
      - "json"
      - "csv"
  
  # Genetic algorithm configuration
  genetic:
    population_size: 50
    generations: 20
    mutation_rate: 0.1
    crossover_rate: 0.7
    elite_size: 5
  
  # Walk-forward configuration
  walkforward:
    optimization_window_days: 252  # 1 year
    test_window_days: 63  # Quarter
    step_size_days: 21  # Month
    min_trades_per_period: 10
  
  # Risk management configuration
  risk:
    max_drawdown: 0.2  # 20%
    max_position_size: 0.25  # 25%
    stop_loss: 0.05  # 5%
    var_confidence: 0.95  # 95%
  
  # Database configuration (using host.docker.internal)
  database:
    host: "host.docker.internal"
    port: 5432
    database: "backtesting"
    username: "backtesting"
    maxConnections: 10
    connectionTimeout: 30
    max_connections: 10
    connection_timeout: 30

# =============================================================================
# Monitoring & Metrics
# =============================================================================

metrics:
  enabled: true
  port: 9090
  path: /metrics

# =============================================================================
# Additional Features (Disabled for Dev)
# =============================================================================

autoscaling:
  enabled: false

ingress:
  enabled: false

cronjob:
  enabled: false

job:
  enabled: false

persistence:
  enabled: false

# =============================================================================
# Security (Relaxed for Dev - runs as root)
# =============================================================================

podSecurityContext: {}

securityContext: {}

