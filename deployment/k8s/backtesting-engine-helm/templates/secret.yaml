apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backtesting-engine.fullname" . }}-secret
  labels:
    {{- include "backtesting-engine.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace | quote }}
type: Opaque
data:
  # Database credentials (base64 encoded)
  {{- if .Values.secrets.database.password }}
  database-password: {{ .Values.secrets.database.password | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.database.password | b64enc | quote }}
  password: {{ .Values.secrets.database.password | b64enc | quote }}
  {{- else }}
  database-password: {{ .Values.config.database.password | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.secrets.database.username }}
  POSTGRES_USER: {{ .Values.secrets.database.username | b64enc | quote }}
  username: {{ .Values.secrets.database.username | b64enc | quote }}
  {{- end }}
  
  # Database URL (shared with DataEngine)
  {{- if .Values.secrets.database.url }}
  DATABASE_URL: {{ .Values.secrets.database.url | b64enc | quote }}
  url: {{ .Values.secrets.database.url | b64enc | quote }}
  {{- end }}
  
  # Elasticsearch credentials (shared with DataEngine) - Optional
  {{- if .Values.secrets.elasticsearch.endpoint }}
  ELASTIC_CLOUD_ENDPOINT: {{ .Values.secrets.elasticsearch.endpoint | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.elasticsearch.username }}
  ELASTIC_CLOUD_USERNAME: {{ .Values.secrets.elasticsearch.username | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.elasticsearch.password }}
  ELASTIC_CLOUD_PASSWORD: {{ .Values.secrets.elasticsearch.password | b64enc | quote }}
  {{- end }}
  
  # Application secrets
  {{- if and .Values.config.secrets .Values.config.secrets.jwt_secret }}
  jwt-secret: {{ .Values.config.secrets.jwt_secret | b64enc | quote }}
  {{- end }}
  
  {{- if and .Values.config.secrets .Values.config.secrets.encryption_key }}
  encryption-key: {{ .Values.config.secrets.encryption_key | b64enc | quote }}
  {{- end }}
  
  {{- if and .Values.config.secrets .Values.config.secrets.api_keys }}
  {{- range $key, $value := .Values.config.secrets.api_keys }}
  api-key-{{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
  
  # API keys (optional, shared pattern)
  {{- if and .Values.secrets.api_keys .Values.secrets.api_keys.kraken_api_key }}
  KRAKEN_API_KEY: {{ .Values.secrets.api_keys.kraken_api_key | b64enc | quote }}
  {{- end }}
  {{- if and .Values.secrets.api_keys .Values.secrets.api_keys.kraken_secret_key }}
  KRAKEN_SECRET_KEY: {{ .Values.secrets.api_keys.kraken_secret_key | b64enc | quote }}
  {{- end }}

stringData:
  # Connection strings (only if not using shared DATABASE_URL)
  {{- if and .Values.secrets.database (not .Values.secrets.database.url) }}
  database-url: "postgresql://{{ include "backtesting-engine.postgresql.username" . }}:{{ .Values.secrets.database.password }}@{{ include "backtesting-engine.postgresql.servicename" . }}:{{ include "backtesting-engine.postgresql.port" . }}/{{ include "backtesting-engine.postgresql.database" . }}"
  {{- end }}
