apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backtesting-engine.fullname" . }}-ui
  labels:
    {{- include "backtesting-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.ui.replicaCount | default 2 }}
  selector:
    matchLabels:
      {{- include "backtesting-engine.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "backtesting-engine.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: UI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backtesting-secrets
                  key: UI_API_KEY
          command: ["/bin/sh", "-c"]
          args:
            - |
              envsubst '${UI_API_KEY}' < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf.template
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "backtesting-engine.fullname" . }}-ui-config
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
