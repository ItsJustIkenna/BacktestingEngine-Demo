apiVersion: v1
kind: Service
metadata:
  name: {{ include "backtesting-engine.fullname" . }}-ui
  labels:
    {{- include "backtesting-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  namespace: {{ .Release.Namespace | quote }}
spec:
  type: {{ .Values.ui.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.ui.service.port | default 80 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "backtesting-engine.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
