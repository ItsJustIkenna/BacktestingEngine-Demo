apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backtesting-engine.fullname" . }}
  labels:
    {{- include "backtesting-engine.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "backtesting-engine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backtesting-engine.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "backtesting-engine.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgresql
          image: "postgres:15-alpine"
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "backtesting-engine.postgresql.servicename" . }} -p {{ include "backtesting-engine.postgresql.port" . }} -U {{ include "backtesting-engine.postgresql.username" . }}; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secret" (include "backtesting-engine.fullname" .)) }}
                  key: database-password
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Run in worker mode - processes background jobs, no HTTP server
          # Using 1 thread to allow full memory for loading ALL historical data
          # Scale horizontally with more pods instead of more threads per pod
          command: ["/bin/server"]
          args: ["worker", "--threads", "{{ .Values.config.performance.worker_threads | default 1 }}"]
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secret" (include "backtesting-engine.fullname" .)) }}
                  key: database-password
            # Use shared DATABASE_URL from secrets (same as DataEngine)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secret" (include "backtesting-engine.fullname" .)) }}
                  key: DATABASE_URL
            
            # Elasticsearch logging configuration (shared with DataEngine)
            {{- if .Values.secrets.elasticsearch.enabled }}
            - name: USE_ELASTICSEARCH_LOGGING
              value: "true"
            - name: ELASTIC_CLOUD_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secret" (include "backtesting-engine.fullname" .)) }}
                  key: ELASTIC_CLOUD_ENDPOINT
            - name: ELASTIC_CLOUD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secret" (include "backtesting-engine.fullname" .)) }}
                  key: ELASTIC_CLOUD_USERNAME
            - name: ELASTIC_CLOUD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secret" (include "backtesting-engine.fullname" .)) }}
                  key: ELASTIC_CLOUD_PASSWORD
            {{- else }}
            - name: USE_ELASTICSEARCH_LOGGING
              value: "false"
            {{- end }}
            
            # Distributed GA configuration
            {{- if .Values.distributedGA.enabled }}
            - name: DISTRIBUTED_GA_ENABLED
              value: "true"
            - name: DISTRIBUTED_GA_MIN_WORKERS
              value: "{{ .Values.distributedGA.minWorkers | default 2 }}"
            - name: MESSAGE_BROKER_URL
              value: "{{ .Values.distributedGA.brokerUrl }}"
            - name: DISTRIBUTED_GA_WORKER_TIMEOUT
              value: "{{ .Values.distributedGA.workerTimeout | default 30 }}"
            {{- end }}
            
            {{- if and .Values.config.secrets .Values.config.secrets.jwt_secret }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secret" (include "backtesting-engine.fullname" .)) }}
                  key: jwt-secret
            {{- end }}
            {{- if and .Values.config.secrets .Values.config.secrets.encryption_key }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secret" (include "backtesting-engine.fullname" .)) }}
                  key: encryption-key
            {{- end }}
            # Load all config from ConfigMap as environment variables
          {{- if .Values.config.envFromConfigMap }}
          envFrom:
            - configMapRef:
                name: {{ include "backtesting-engine.fullname" . }}-config
          {{- else }}
            # Individual environment variables from ConfigMap
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "backtesting-engine.fullname" . }}-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "backtesting-engine.fullname" . }}-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "backtesting-engine.fullname" . }}-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "backtesting-engine.fullname" . }}-config
                  key: DATABASE_USER
            - name: APP_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "backtesting-engine.fullname" . }}-config
                  key: APP_PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "backtesting-engine.fullname" . }}-config
                  key: LOG_LEVEL
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "backtesting-engine.fullname" . }}-config
                  key: RUST_LOG
            {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: {{ .Values.config.output.results_dir }}
              subPath: results
            - name: data-volume
              mountPath: {{ .Values.config.output.reports_dir }}
              subPath: reports
            {{- end }}
            {{- if .Values.config.logging.file_enabled }}
            - name: logs-volume
              mountPath: /app/logs
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- if .Values.livenessProbe.exec }}
            exec:
              command:
                {{- toYaml .Values.livenessProbe.exec.command | nindent 16 }}
            {{- else if .Values.livenessProbe.httpGet }}
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            {{- end }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- if .Values.readinessProbe.exec }}
            exec:
              command:
                {{- toYaml .Values.readinessProbe.exec.command | nindent 16 }}
            {{- else if .Values.readinessProbe.httpGet }}
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            {{- end }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "backtesting-engine.fullname" . }}-config
            items:
              - key: config.yaml
                path: config.yaml
        {{- if .Values.persistence.enabled }}
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "backtesting-engine.fullname" . }}-data
        {{- else }}
        - name: data-volume
          emptyDir: {}
        {{- end }}
        {{- if .Values.config.logging.file_enabled }}
        - name: logs-volume
          {{- if .Values.persistence.logs.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "backtesting-engine.fullname" . }}-logs
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
