[package]
name = "strategy-export-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "strategy-export"
path = "examples/strategy_export_cli.rs"

[dependencies]
strategy = { path = ".." }
backtest = { path = "../backtest" }
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
bigdecimal = "0.4"
chrono = { version = "0.4", features = ["serde"] }
