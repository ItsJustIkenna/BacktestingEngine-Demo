database:
  host: localhost
  port: 5432
  database: trading_platform
  username: postgres
  password: password
  max_connections: 10
  connection_timeout: 30
trading:
  commission_rate: 0.001
  slippage_bps: 5.0
  initial_capital: 100000.0
  max_position_size: 0.1
  risk_free_rate: 0.02
data:
  default_timeframe: 1d
  data_sources:
  - yahoo
  cache_enabled: true
  cache_duration_hours: 24
output:
  results_dir: ./results
  reports_dir: ./reports
  charts_enabled: true
  export_formats:
  - json
  - csv
